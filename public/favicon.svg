<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.08" />
    </linearGradient>

    <!-- Sparkle Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e4e4e7" />
    </linearGradient>
  </defs>
  
  <!-- Outer Rounded Squircle Background -->
  <rect x="4" y="4" width="120" height="120" rx="32" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3.5"/>
  
  <!-- Resume Sheet Icon -->
  <rect x="36" y="28" width="56" height="72" rx="8" fill="#ffffff"/>
  
  <!-- Document Folded Corner Effect -->
  <path d="M 76 28 L 92 44 L 76 44 Z" fill="#e4e4e7"/>
  
  <!-- Resume Content Lines -->
  <line x1="46" y1="42" x2="68" y2="42" stroke="#18181b" stroke-width="4" stroke-linecap="round"/>
  <line x1="46" y1="52" x2="82" y2="52" stroke="#71717a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="62" x2="78" y2="62" stroke="#71717a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="72" x2="72" y2="72" stroke="#71717a" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="46" y1="82" x2="64" y2="82" stroke="#71717a" stroke-width="3.5" stroke-linecap="round"/>
  
  <!-- Floating AI Neural Sparkle Emblem -->
  <g transform="translate(86, 22)">
    <circle cx="14" cy="14" r="16" fill="#09090b" stroke="#ffffff" stroke-width="2"/>
    <path d="M 14 4 C 14 10 18 14 24 14 C 18 14 14 18 14 24 C 14 18 10 14 4 14 C 10 14 14 10 14 4 Z" fill="url(#sparkleGrad)"/>
  </g>
</svg>
